<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - TechZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                TechZone
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sobre.html">
                            Sobre
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="servicos.html">
                            Serviços
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                            aria-current="page"
                            href="contato.html">
                            Contato
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Título -->
    <div class="container py-5">

        <div class="text-center mb-5">

            <h1 class="display-5 fw-bold">
                Entre em contato
            </h1>

            <p class="lead">
                Fale com a TechZone e conte como podemos ajudar.
            </p>

        </div>


        <!-- Formulário -->
        <div class="row justify-content-center">

            <div class="col-md-8">

                <form class="row g-3">

                    <!-- Nome -->
                    <div class="col-md-6">

                        <label for="nome" class="form-label">
                            Nome
                        </label>

                        <input type="text"
                            class="form-control"
                            id="nome"
                            placeholder="Digite seu nome"
                            required>

                    </div>


                    <!-- Sobrenome -->
                    <div class="col-md-6">

                        <label for="sobrenome" class="form-label">
                            Sobrenome
                        </label>

                        <input type="text"
                            class="form-control"
                            id="sobrenome"
                            placeholder="Digite seu sobrenome"
                            required>

                    </div>


                    <!-- E-mail -->
                    <div class="col-12">

                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                            class="form-control"
                            id="email"
                            placeholder="exemplo@email.com"
                            required>

                    </div>


                    <!-- Telefone -->
                    <div class="col-md-6">

                        <label for="telefone" class="form-label">
                            Telefone
                        </label>

                        <input type="tel"
                            class="form-control"
                            id="telefone"
                            placeholder="(00) 00000-0000"
                            required>

                    </div>


                    <!-- Serviço -->
                    <div class="col-md-6">

                        <label for="servico" class="form-label">
                            Serviço
                        </label>

                        <select class="form-select"
                            id="servico"
                            required>

                            <option selected disabled value="">
                                Escolha um serviço
                            </option>

                            <option>
                                Desenvolvimento Web
                            </option>

                            <option>
                                Suporte Técnico
                            </option>

                            <option>
                                Soluções em Tecnologia
                            </option>

                        </select>

                    </div>


                    <!-- Assunto -->
                    <div class="col-12">

                        <label for="assunto" class="form-label">
                            Assunto
                        </label>

                        <input type="text"
                            class="form-control"
                            id="assunto"
                            placeholder="Digite o assunto"
                            required>

                    </div>


                    <!-- Mensagem -->
                    <div class="col-12">

                        <label for="mensagem" class="form-label">
                            Mensagem
                        </label>

                        <textarea class="form-control"
                            id="mensagem"
                            rows="5"
                            placeholder="Digite sua mensagem..."
                            required></textarea>

                    </div>


                    <!-- Termos -->
                    <div class="col-12">

                        <div class="form-check">

                            <input class="form-check-input"
                                type="checkbox"
                                id="termos"
                                required>

                            <label class="form-check-label"
                                for="termos">

                                Concordo com os termos e condições.

                            </label>

                        </div>

                    </div>


                    <!-- Botão -->
                    <div class="col-12 text-center">

                        <button type="submit"
                            class="btn btn-primary btn-lg">

                            Enviar mensagem

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- Informações de contato -->
    <div class="bg-light py-5">

        <div class="container">

            <div class="row text-center">

                <div class="col-md-4">

                    <h4>
                        📧 E-mail
                    </h4>

                    <p>
                        contato@techzone.com
                    </p>

                </div>


                <div class="col-md-4">

                    <h4>
                        📱 Telefone
                    </h4>

                    <p>
                        (11) 99999-9878
                    </p>

                </div>


                <div class="col-md-4">

                    <h4>
                        📍 Localização
                    </h4>

                    <p>
                        São Paulo - SP
                    </p>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">

        <p class="mb-0">
            © 2026 TechZone - Todos os direitos reservados.
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
